[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "taketwo"
version = "0.1.0"
description = "Speech analysis workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "soundfile==0.13.1",
  "pydantic==2.11.7",
  "librosa==0.11.0",
  "threadpoolctl==3.7.0",
  "fastapi==0.143.0",
  "uvicorn==0.42.0",
  "python-multipart==0.0.31",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.12.5",
]

[project.scripts]
taketwo-dataset = "taketwo.dataset.cli:main"
taketwo-analysis = "taketwo.analysis.cli:main"
taketwo-comparison = "taketwo.comparison.cli:main"
taketwo-web = "taketwo.web.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
# Explicit source inputs also protect builds outside a Git-aware environment.
include = [
  "/src", "/tests", "/scripts", "/docs", "/environments", "/.github",
  "/frontend/src", "/frontend/tests", "/frontend/*.ts", "/frontend/*.js",
  "/frontend/*.json", "/frontend/index.html",
  "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
  "/.gitattributes", "/.gitignore", "/requirments/Track C.pdf",
  "/output/pdf/taketwo-technical-report-2026-10-15.pdf",
]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/*.tsbuildinfo"]
